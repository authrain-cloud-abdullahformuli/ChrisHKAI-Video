<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675">
  <defs>
    <!-- Background Gradients -->
    <radialGradient id="studioLight" cx="50%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#1E293B" stop-opacity="0.8"/>
      <stop offset="60%" stop-color="#0F172A" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#020617" stop-opacity="1"/>
    </radialGradient>
    
    <linearGradient id="floorGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0F172A" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#020617" stop-opacity="1"/>
    </linearGradient>

    <!-- Card & Wall Gradients -->
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E293B"/>
      <stop offset="100%" stop-color="#0F172A"/>
    </linearGradient>

    <linearGradient id="cyanNeon" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06B6D4"/>
      <stop offset="100%" stop-color="#3B82F6"/>
    </linearGradient>

    <linearGradient id="amberNeon" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#F59E0B"/>
      <stop offset="100%" stop-color="#EF4444"/>
    </linearGradient>

    <!-- 3D Toy Shading Gradients -->
    <radialGradient id="toyHead" cx="35%" cy="30%" r="65%">
      <stop offset="0%" stop-color="#F1F5F9"/>
      <stop offset="50%" stop-color="#CBD5E1"/>
      <stop offset="100%" stop-color="#64748B"/>
    </radialGradient>

    <linearGradient id="visorGlass" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06B6D4"/>
      <stop offset="50%" stop-color="#0284C7"/>
      <stop offset="100%" stop-color="#0369A1"/>
    </linearGradient>

    <linearGradient id="hoodieGrad" x1="20%" y1="0%" x2="80%" y2="100%">
      <stop offset="0%" stop-color="#334155"/>
      <stop offset="60%" stop-color="#1E293B"/>
      <stop offset="100%" stop-color="#0F172A"/>
    </linearGradient>

    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>

    <filter id="dropShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.6"/>
    </filter>
  </defs>

  <!-- Studio Stage Background -->
  <rect width="1200" height="675" fill="url(#studioLight)"/>

  <!-- Perspective Studio Floor -->
  <path d="M 0 450 L 1200 450 L 1200 675 L 0 675 Z" fill="url(#floorGrad)"/>
  <line x1="0" y1="450" x2="1200" y2="450" stroke="#334155" stroke-width="1.5" stroke-opacity="0.4"/>
  <line x1="200" y1="450" x2="50" y2="675" stroke="#334155" stroke-width="1" stroke-opacity="0.25"/>
  <line x1="400" y1="450" x2="300" y2="675" stroke="#334155" stroke-width="1" stroke-opacity="0.25"/>
  <line x1="600" y1="450" x2="600" y2="675" stroke="#334155" stroke-width="1" stroke-opacity="0.25"/>
  <line x1="800" y1="450" x2="900" y2="675" stroke="#334155" stroke-width="1" stroke-opacity="0.25"/>
  <line x1="1000" y1="450" x2="1150" y2="675" stroke="#334155" stroke-width="1" stroke-opacity="0.25"/>

  <!-- Left: Monolithic Standing Proof Wall 1 -->
  <g transform="translate(80, 110) skewY(-3)" filter="url(#dropShadow)">
    <rect width="360" height="400" rx="16" fill="url(#cardGrad)" stroke="#38BDF8" stroke-width="1.5" stroke-opacity="0.5"/>
    <!-- Card Header -->
    <rect x="24" y="24" width="48" height="48" rx="12" fill="#0284C7"/>
    <text x="48" y="55" fill="#FFFFFF" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="24" font-weight="900" text-anchor="middle">𝕏</text>
    <text x="86" y="44" fill="#F8FAFC" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="700">Abdullah Formuli</text>
    <text x="86" y="64" fill="#94A3B8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13">@abdullahformuli</text>
    
    <!-- Tweet Post Content -->
    <text x="24" y="110" fill="#E2E8F0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="600">Day 54 of shipping until I Land SWE or YC</text>
    <rect x="24" y="125" width="312" height="1" fill="#334155"/>
    <text x="24" y="152" fill="#94A3B8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13">Open-sourced scroll-craft: agent skill &amp;</text>
    <text x="24" y="172" fill="#94A3B8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13">engine for premium scroll-driven websites.</text>

    <!-- Milestone Blocks -->
    <rect x="24" y="200" width="312" height="76" rx="10" fill="#0F172A" stroke="#334155" stroke-width="1"/>
    <text x="40" y="228" fill="#38BDF8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="22" font-weight="800">54 DAYS</text>
    <text x="40" y="254" fill="#64748B" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600">CONSECUTIVE PUBLIC SHIPS</text>

    <rect x="24" y="290" width="312" height="76" rx="10" fill="#0F172A" stroke="#334155" stroke-width="1"/>
    <text x="40" y="318" fill="#F59E0B" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="22" font-weight="800">740+ OFFERS</text>
    <text x="40" y="344" fill="#64748B" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600">AI-EVALUATED PIPELINE</text>
  </g>

  <!-- Right: Monolithic Standing Proof Wall 2 -->
  <g transform="translate(760, 140) skewY(3)" filter="url(#dropShadow)">
    <rect width="360" height="360" rx="16" fill="url(#cardGrad)" stroke="#6366F1" stroke-width="1.5" stroke-opacity="0.4"/>
    <text x="28" y="48" fill="#A5B4FC" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="700" letter-spacing="1.5">3D VINYL TOY GENERATION ENGINE</text>
    
    <rect x="28" y="70" width="304" height="60" rx="8" fill="#0F172A" stroke="#334155" stroke-width="1"/>
    <text x="44" y="98" fill="#F8FAFC" font-family="monospace" font-size="13">FILM=abdullahformuli</text>
    <text x="44" y="116" fill="#38BDF8" font-family="monospace" font-size="12">&gt; blender --cycles render --samples 128</text>

    <rect x="28" y="145" width="304" height="180" rx="8" fill="#020617" stroke="#1E293B" stroke-width="1"/>
    <!-- Wireframe / Rig Schematic -->
    <path d="M 60 290 L 180 175 L 300 290 Z" fill="none" stroke="#06B6D4" stroke-width="1" stroke-dasharray="4,4"/>
    <circle cx="180" cy="180" r="16" fill="#0284C7" fill-opacity="0.3" stroke="#38BDF8" stroke-width="1.5"/>
    <line x1="180" y1="196" x2="180" y2="250" stroke="#38BDF8" stroke-width="2"/>
    <line x1="180" y1="215" x2="140" y2="245" stroke="#38BDF8" stroke-width="2"/>
    <line x1="180" y1="215" x2="220" y2="245" stroke="#38BDF8" stroke-width="2"/>
    <line x1="180" y1="250" x2="155" y2="300" stroke="#38BDF8" stroke-width="2"/>
    <line x1="180" y1="250" x2="205" y2="300" stroke="#38BDF8" stroke-width="2"/>
    <text x="180" y="315" fill="#38BDF8" font-family="monospace" font-size="11" text-anchor="middle">SDF MESH RIG &amp; PROCEDURAL AUDIO</text>
  </g>

  <!-- Center Stage: 3D Pedestal -->
  <g transform="translate(600, 480)" filter="url(#dropShadow)">
    <!-- Pedestal Base Cylinders -->
    <ellipse cx="0" cy="40" rx="150" ry="32" fill="#0B132B"/>
    <path d="M -150 20 A 150 32 0 0 0 150 20 L 150 40 A 150 32 0 0 1 -150 40 Z" fill="#1E293B"/>
    <ellipse cx="0" cy="20" rx="150" ry="32" fill="#1E293B" stroke="#06B6D4" stroke-width="2" filter="url(#neonGlow)"/>
    <ellipse cx="0" cy="20" rx="135" ry="28" fill="#0F172A" stroke="#38BDF8" stroke-width="1"/>
  </g>

  <!-- Center Stage: 3D Stylized Vinyl Engineer Toy Mascot (ZERO human face photos - stylized geometric toy figurine) -->
  <g transform="translate(600, 310)" filter="url(#dropShadow)">
    <!-- Toy Shadow on Pedestal -->
    <ellipse cx="0" cy="180" rx="60" ry="16" fill="#000000" fill-opacity="0.6"/>

    <!-- Sneakers (Chunky Vinyl Feet) -->
    <ellipse cx="-34" cy="172" rx="22" ry="12" fill="#0284C7"/>
    <ellipse cx="34" cy="172" rx="22" ry="12" fill="#0284C7"/>
    <ellipse cx="-34" cy="170" rx="18" ry="9" fill="#F8FAFC"/>
    <ellipse cx="34" cy="170" rx="18" ry="9" fill="#F8FAFC"/>

    <!-- Legs -->
    <rect x="-42" y="130" width="18" height="45" rx="9" fill="#1E293B"/>
    <rect x="24" y="130" width="18" height="45" rx="9" fill="#1E293B"/>

    <!-- Hoodie Body (Plump Vinyl Toy Torso) -->
    <ellipse cx="0" cy="95" rx="62" ry="50" fill="url(#hoodieGrad)"/>
    <path d="M -45 60 C -55 100, -50 135, -20 145 L 20 145 C 50 135, 55 100, 45 60 Z" fill="url(#hoodieGrad)"/>

    <!-- Hoodie Drawstrings & Badge -->
    <circle cx="0" cy="90" r="14" fill="#0F172A" stroke="#06B6D4" stroke-width="2"/>
    <text x="0" y="95" fill="#38BDF8" font-family="monospace" font-size="12" font-weight="900" text-anchor="middle">&lt;/&gt;</text>
    <line x1="-12" y1="65" x2="-12" y2="105" stroke="#94A3B8" stroke-width="3" stroke-linecap="round"/>
    <line x1="12" y1="65" x2="12" y2="105" stroke="#94A3B8" stroke-width="3" stroke-linecap="round"/>

    <!-- Chunky Toy Arms / Hands -->
    <ellipse cx="-64" cy="100" rx="15" ry="30" fill="url(#hoodieGrad)" transform="rotate(15 -64 100)"/>
    <circle cx="-68" cy="128" r="13" fill="#E2E8F0"/>
    <ellipse cx="64" cy="100" rx="15" ry="30" fill="url(#hoodieGrad)" transform="rotate(-15 64 100)"/>
    <circle cx="68" cy="128" r="13" fill="#E2E8F0"/>

    <!-- Stylized Toy Head (Large Smooth Vinyl Sphere) -->
    <circle cx="0" cy="15" r="58" fill="url(#toyHead)"/>

    <!-- High-Tech Neon Cyber Visor / Goggles (Replaces any human face features) -->
    <rect x="-46" y="-5" width="92" height="36" rx="18" fill="#0B132B" stroke="#06B6D4" stroke-width="2.5" filter="url(#neonGlow)"/>
    <rect x="-42" y="-2" width="84" height="30" rx="15" fill="url(#visorGlass)"/>
    <!-- Digital Glint on Visor -->
    <path d="M -30 2 L -10 2 L -20 22 L -35 22 Z" fill="#FFFFFF" fill-opacity="0.45"/>
    <circle cx="18" cy="12" r="4" fill="#E0F2FE" filter="url(#neonGlow)"/>

    <!-- Vinyl Mascot Headphone / Antenna Accents -->
    <rect x="-65" y="0" width="12" height="30" rx="6" fill="#0284C7"/>
    <rect x="53" y="0" width="12" height="30" rx="6" fill="#0284C7"/>
    <line x1="0" y1="-43" x2="0" y2="-65" stroke="#0284C7" stroke-width="4" stroke-linecap="round"/>
    <circle cx="0" cy="-68" r="7" fill="#38BDF8" filter="url(#neonGlow)"/>
  </g>

  <!-- Top Title / Overlay Badge -->
  <g transform="translate(600, 60)" text-anchor="middle">
    <rect x="-190" y="-24" width="380" height="42" rx="21" fill="#0F172A" fill-opacity="0.85" stroke="#38BDF8" stroke-width="1.5"/>
    <text x="0" y="3" fill="#F8FAFC" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="15" font-weight="700" letter-spacing="1">
      3D VINYL TOY CREATOR FILM · SHOWCASE
    </text>
  </g>
</svg>
